name: M4 CPU reproduction
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-m4-cpu.lock -r requirements.txt -r drafter/requirements.txt -r critic/requirements.txt -r evaluation/r1_v4/requirements.txt
      - run: python -m pip check
      - name: Verify RegistryV3 CPU dependencies
        run: python -c "import h5py, jsonschema, numpy"
      - name: Verify RegistryV3 2.1 Task 8C synthetic fixtures
        run: python -m unittest discover -s evaluation/r1_v4/evidence_registry_gsn/tests -p 'test_registry_v3_task8c.py' -v
      - name: Verify RegistryV3 2.0 backward compatibility
        run: python -m unittest discover -s evaluation/r1_v4/evidence_registry_gsn/tests -p 'test_registry_v3.py' -v
      - name: Verify recovered Task 8C source adapter synthetic fixtures
        run: python -m unittest discover -s evaluation/r1_v4/task8c_r1v3_adapter/tests -p 'test_task8c_adapter*.py' -v
        env:
          PYTHONPATH: evaluation/r1_v4/task8c_r1v3_adapter
      - name: Verify Checker admission gates
        run: python -m unittest evaluation.r1_v4.checker_v3_admission.tests.test_admission -v
      - name: Verify frozen R1 v3 Checker regressions
        run: python -m unittest discover -s evaluation/r1_v3/tests -p 'test_checker.py' -v
      - run: python integration/replay_m4_tables.py
      - run: python -m unittest integration.tests.test_handoff integration.tests.test_replay_m4_tables -v
      - run: python -m unittest discover -s evaluation/m4_20261127/rq4/tests -p 'test_*.py' -v
      - run: python -m unittest drafter.tests.test_r1v3_profile drafter.tests.test_r1v3_generation -v
      - run: python -m evaluation.m4_20261127.integration.build_r1v3_request --check
      - run: git diff --exit-code
