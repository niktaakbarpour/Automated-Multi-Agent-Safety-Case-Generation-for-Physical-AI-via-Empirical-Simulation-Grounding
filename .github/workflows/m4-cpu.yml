name: M4 CPU reproduction
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-m4-cpu.lock -r requirements.txt -r drafter/requirements.txt -r critic/requirements.txt -r evaluation/r1_v4/requirements.txt
      - run: python -m pip check
      - run: python integration/replay_m4_tables.py
      - run: python -m unittest integration.tests.test_handoff integration.tests.test_replay_m4_tables -v
      - run: python -m unittest discover -s evaluation/m4_20261127/rq4/tests -p 'test_*.py' -v
      - run: python -m unittest drafter.tests.test_r1v3_profile drafter.tests.test_r1v3_generation -v
      - run: python -m evaluation.m4_20261127.integration.build_r1v3_request --check
      - name: RQ1 requested-obligation planner regressions (synthetic/development fixtures)
        run: python -m unittest evaluation.r1_v4.rag_evidence_database.retrieval_remediation.tests.test_requested_obligations_v2 evaluation.r1_v4.rag_evidence_database.retrieval_remediation.tests.test_bundle_v2_contract -v
      - run: git diff --exit-code
